name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        env:
          # Project site: https://tamb.github.io/walk-hero/
          VITE_BASE_PATH: /walk-hero/
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # A custom domain stored in Pages settings survives an artifact with no
      # CNAME file. Clear it after each publish so the site stays on github.io.
      - name: Drop the custom domain
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -sS -D /tmp/pages.headers -o /tmp/pages.json -X PUT \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" \
            -d '{"cname":null}'
          python3 - <<'PY'
          import json
          from pathlib import Path
          status = next(
              (line for line in Path("/tmp/pages.headers").read_text().splitlines() if line.startswith("HTTP/")),
              "",
          )
          body = json.loads(Path("/tmp/pages.json").read_text() or "{}")
          print(status)
          print("html_url", body.get("html_url"))
          print("cname", body.get("cname"))
          code = status.split()[1] if status else ""
          if not code.startswith("2") or body.get("cname"):
              raise SystemExit(1)
          PY
